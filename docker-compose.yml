services:
  api:
    container_name: form_api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MYSQL_HOST: ${MYSQL_HOST:-host.docker.internal}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./api/public/uploads:/app/public/uploads
      - ./api/public/uploads:/app/dist/public/uploads
    networks:
      - form-network

  form_builder:
    container_name: form_frontend
    build:
      context: ./form_builder
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      INTERNAL_API_URL: http://form_api:3001/api
    depends_on:
      - api
    networks:
      - form-network

networks:
  form-network:
    driver: bridge
